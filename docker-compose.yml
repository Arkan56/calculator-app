services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    # Not published to the host: only nginx talks to it on the internal network.
    # Uncomment to call the API directly (e.g. with curl) at localhost:8080.
    # ports:
    #   - "8080:8080"

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
